services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: olr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-location_resolver}
      POSTGRES_USER: ${POSTGRES_USER:-olr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olr_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olr_user} -d ${POSTGRES_DB:-location_resolver}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
